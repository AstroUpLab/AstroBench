name: Portable protocol checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: astrobench plan examples/catalog.json --object-set custom --seed 42 --output /tmp/astrobench-plan.json
      - run: astrobench objects --output /tmp/core20.json
      - run: astrobench objects --object-set objaverse8414 --output /tmp/objaverse8414.json
      - run: astrobench scenes --output /tmp/scenes.json
      - run: astrobench workcell-check-assets assets/workcells --output /tmp/workcell-assets.json
      - run: astrobench workcell-plan --workcell all --repeats 2 --seed 42 --asset-root assets/workcells --output /tmp/workcell-plan.json
