[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astrobench-protocol"
version = "0.3.0"
description = "Free-floating manipulation and reference-based space workcell task protocols"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []

[project.scripts]
astrobench = "astrobench.cli:main"

[tool.setuptools.packages.find]
include = ["astrobench*"]

[tool.setuptools.package-data]
astrobench = ["data/*.json", "data/*.jsonl.gz"]
