[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astrobench-protocol"
version = "0.2.0.dev0"
description = "Portable evaluation protocol for free-floating object manipulation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
astrobench = "astrobench.cli:main"

[tool.setuptools.packages.find]
include = ["astrobench*"]

[tool.setuptools.package-data]
astrobench = ["data/*.json", "data/*.jsonl.gz"]
